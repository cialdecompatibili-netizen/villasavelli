<div class="page__footer-custom">{% if site.footer_text %}{{ site.footer_text }}{% else %}&copy; {{ site.time | date: '%Y' }} <a href="{{ site.url }}">{{ site.title }}</a>{% endif %}</div>

<div id="cp-lightbox" onclick="closeLightbox()" style="display:none;position:fixed;z-index:9999;inset:0;background:rgba(0,0,0,.9);cursor:zoom-out;align-items:center;justify-content:center;flex-direction:column;">
  <img id="cp-lightbox-img" src="" alt="" style="max-width:92vw;max-height:88vh;object-fit:contain;border-radius:8px;">
  <span id="cp-lightbox-caption" style="color:#eee;margin-top:.8em;font-size:14px;"></span>
  <span onclick="closeLightbox()" style="position:absolute;top:18px;right:28px;color:#fff;font-size:32px;cursor:pointer;line-height:1;">&times;</span>
</div>
<script>
function openLightbox(src, caption) {
  var lb = document.getElementById('cp-lightbox');
  document.getElementById('cp-lightbox-img').src = src;
  document.getElementById('cp-lightbox-caption').textContent = caption || '';
  lb.style.display = 'flex';
  document.body.style.overflow = 'hidden';
}
function closeLightbox() {
  document.getElementById('cp-lightbox').style.display = 'none';
  document.body.style.overflow = '';
}
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeLightbox(); });
document.addEventListener('click', function(e) {
  var trig = e.target.closest('.lightbox-trigger');
  if (trig) {
    e.preventDefault();
    var img = trig.querySelector('img');
    openLightbox(trig.getAttribute('href') || img.src, trig.getAttribute('data-lightbox-caption') || img.alt);
  }
});
</script>
