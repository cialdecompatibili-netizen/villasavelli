{% assign items = site[include.coll] | sort: include.ord %}
<style>
.exl{--ink:#111;--muted:#5b5b5b;--line:#e3e3e3;--warm:#fbf3ea;--acc:#d9480f;max-width:1180px;margin:0 auto}
.exl-g{display:grid;grid-template-columns:repeat(2,1fr);gap:1.25rem}
.exl-c{display:flex;flex-direction:column;gap:.5rem;padding:1.4rem 1.5rem;border:1px solid var(--line);border-radius:10px;background:#fff;text-decoration:none!important;color:inherit;transition:border-color .2s,box-shadow .2s,transform .2s}
.exl-c:hover{border-color:var(--acc);box-shadow:0 6px 18px rgba(0,0,0,.08);transform:translateY(-2px)}
.exl-t{font-weight:700;font-size:1.15rem;line-height:1.25;color:var(--ink)}
.exl-d{font-size:.95rem;line-height:1.5;color:var(--muted);flex:1}
.exl-m{font-size:.9rem;font-weight:600;color:var(--acc)}
@media(max-width:700px){.exl-g{grid-template-columns:1fr}}
</style>
<div class="exl"><div class="exl-g">
{% for s in items %}<a class="exl-c" href="{{ s.url | relative_url }}"><span class="exl-t">{{ s.title }}</span><span class="exl-d">{{ s.description | default: s.excerpt | strip_html | strip | truncatewords: 22 }}</span><span class="exl-m">Scopri di pi&ugrave; &rarr;</span></a>
{% endfor %}
</div></div>
